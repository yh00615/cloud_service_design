AWSTemplateFormatVersion: '2010-09-09'
Description: 'Week 13-2: QuickTable API with AWS X-Ray Tracing (DynamoDB, Lambda, API Gateway)'

Parameters:
  EnvironmentName:
    Type: String
    Default: week13-2-xray-lab
    Description: Environment name for resource naming
    AllowedPattern: ^[a-z0-9-]+$
    ConstraintDescription: Must contain only lowercase letters, numbers, and hyphens

  ProjectTag:
    Type: String
    Default: 'AWS-Lab'
    Description: Project tag value

  WeekTag:
    Type: String
    Default: '13-2'
    Description: Week tag value

  CreatedByTag:
    Type: String
    Default: 'CloudFormation'
    Description: CreatedBy tag value

Resources:
  # Amazon DynamoDB 테이블: Reservations
  ReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-Reservations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: reservationId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: reservationId
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # AWS IAM 역할: Lambda 실행 역할 (DynamoDB + X-Ray 권한)
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-Lambda-ExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt ReservationsTable.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # AWS IAM 역할: Layer 빌더 Lambda 실행 역할
  LayerBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-LayerBuilder-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LayerManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:PublishLayerVersion
                  - lambda:DeleteLayerVersion
                  - lambda:GetLayerVersion
                  - lambda:ListLayerVersions
                  - lambda:UpdateFunctionConfiguration
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Custom Resource Lambda: X-Ray SDK Layer 자동 빌드
  XRaySDKLayerBuilder:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-LayerBuilder'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt LayerBuilderRole.Arn
      Timeout: 120
      MemorySize: 512
      Code:
        ZipFile: |
          """
          Custom Resource: aws-xray-sdk Lambda Layer 자동 빌드

          CloudFormation Custom Resource로 호출되어 aws-xray-sdk 패키지를
          Lambda Layer로 빌드하고 배포합니다.
          """
          import json
          import os
          import subprocess
          import zipfile
          import boto3
          import urllib.request

          def handler(event, context):
              response_data = {}
              try:
                  request_type = event['RequestType']
                  if request_type == 'Delete':
                      client = boto3.client('lambda')
                      layer_name = os.environ.get('LAYER_NAME', 'xray-sdk-layer')
                      env_name = os.environ.get('ENVIRONMENT_NAME', '')
                      # Layer를 참조하는 함수들의 Layers 설정 제거
                      function_names = [
                          f'{env_name}-CreateReservation',
                          f'{env_name}-GetReservations'
                      ]
                      for func_name in function_names:
                          try:
                              client.update_function_configuration(
                                  FunctionName=func_name,
                                  Layers=[]
                              )
                          except Exception as e:
                              print(f'Function update warning ({func_name}): {e}')
                      # Layer 버전 삭제
                      try:
                          versions = client.list_layer_versions(LayerName=layer_name)
                          for v in versions.get('LayerVersions', []):
                              client.delete_layer_version(
                                  LayerName=layer_name,
                                  VersionNumber=v['Version']
                              )
                      except Exception as e:
                          print(f'Layer deletion warning: {e}')
                      send_response(event, context, 'SUCCESS', {})
                      return

                  # pip install aws-xray-sdk to /tmp/python
                  install_dir = '/tmp/python'
                  os.makedirs(install_dir, exist_ok=True)
                  subprocess.check_call([
                      'pip', 'install', 'aws-xray-sdk', '-t', install_dir, '--quiet'
                  ])

                  # zip 패키징
                  zip_path = '/tmp/xray-sdk-layer.zip'
                  with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
                      for root, dirs, files in os.walk('/tmp/python'):
                          for f in files:
                              full_path = os.path.join(root, f)
                              arcname = os.path.relpath(full_path, '/tmp')
                              zf.write(full_path, arcname)

                  # Layer 배포
                  client = boto3.client('lambda')
                  with open(zip_path, 'rb') as f:
                      layer_content = f.read()

                  response = client.publish_layer_version(
                      LayerName=f"{os.environ.get('LAYER_NAME', 'xray-sdk-layer')}",
                      Description='AWS X-Ray SDK for Python (auto-built)',
                      Content={'ZipFile': layer_content},
                      CompatibleRuntimes=['python3.13', 'python3.12'],
                  )

                  response_data['LayerVersionArn'] = response['LayerVersionArn']
                  send_response(event, context, 'SUCCESS', response_data)

              except Exception as e:
                  print(f'Error: {e}')
                  send_response(event, context, 'FAILED', {'Error': str(e)})

          def send_response(event, context, status, data):
              body = json.dumps({
                  'Status': status,
                  'Reason': f'See CloudWatch Log Stream: {context.log_stream_name}',
                  'PhysicalResourceId': context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data
              })
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=body.encode('utf-8'),
                  headers={'Content-Type': 'application/json'},
                  method='PUT'
              )
              urllib.request.urlopen(req)
      Environment:
        Variables:
          LAYER_NAME: !Sub '${EnvironmentName}-xray-sdk'
          ENVIRONMENT_NAME: !Ref EnvironmentName
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Custom Resource: Layer 빌드 트리거
  XRaySDKLayer:
    Type: Custom::XRaySDKLayer
    Properties:
      ServiceToken: !GetAtt XRaySDKLayerBuilder.Arn

  # AWS Lambda 함수: CreateReservation (X-Ray SDK 통합)
  CreateReservationFunction:
    Type: AWS::Lambda::Function
    DependsOn: XRaySDKLayer
    Properties:
      FunctionName: !Sub '${EnvironmentName}-CreateReservation'
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      TracingConfig:
        Mode: Active
      Layers:
        - !GetAtt XRaySDKLayer.LayerVersionArn
      Environment:
        Variables:
          TABLE_NAME: !Ref ReservationsTable
      Code:
        ZipFile: |
          """
          QuickTable 예약 생성 Lambda 함수 (AWS X-Ray SDK 통합)

          이 함수는 예약 생성 요청을 처리하고, AWS X-Ray SDK를 사용하여
          커스텀 서브세그먼트, 어노테이션, 메타데이터를 기록합니다.

          환경 변수:
              TABLE_NAME (str): DynamoDB 테이블 이름
          """
          import json
          import boto3
          import os
          import uuid
          from datetime import datetime
          from aws_xray_sdk.core import patch_all, xray_recorder

          # boto3 DynamoDB 호출 자동 추적
          patch_all()

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])

          def lambda_handler(event, context):
              """
              예약 생성 핸들러

              Args:
                  event (dict): API Gateway 프록시 이벤트
                  context: Lambda 실행 컨텍스트

              Returns:
                  dict: HTTP 응답 (statusCode, headers, body)
              """
              try:
                  body = json.loads(event.get('body', '{}'))
                  user_id = body.get('userId', 'anonymous')
                  date_str = body.get('date', '')
                  time_str = body.get('time', '')
                  reservation_id = f"RSV-{date_str.replace('-', '')}-{uuid.uuid4().hex[:8]}"

                  # 커스텀 서브세그먼트: 입력 검증
                  subsegment = xray_recorder.begin_subsegment('validate_input')
                  subsegment.put_annotation('operation', 'create')
                  subsegment.put_annotation('restaurantName', body.get('restaurantName', ''))
                  subsegment.put_annotation('date', date_str)
                  subsegment.put_metadata('request_body', body)
                  xray_recorder.end_subsegment()

                  # 커스텀 서브세그먼트: DynamoDB 저장
                  subsegment = xray_recorder.begin_subsegment('create_dynamodb_item')
                  item = {
                      'userId': user_id,
                      'reservationId': reservation_id,
                      'restaurantName': body.get('restaurantName', ''),
                      'date': date_str,
                      'time': time_str,
                      'partySize': int(body.get('partySize', 1)),
                      'phoneNumber': body.get('phoneNumber', ''),
                      'status': 'confirmed',
                      'createdAt': datetime.utcnow().isoformat()
                  }
                  subsegment.put_annotation('reservation_id', reservation_id)
                  subsegment.put_annotation('status', 'confirmed')
                  subsegment.put_metadata('reservation_data', item)
                  table.put_item(Item=item)
                  xray_recorder.end_subsegment()

                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'message': 'Reservation created', 'reservationId': reservation_id})
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'error': str(e)})
                  }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # AWS Lambda 함수: GetReservations (X-Ray SDK 통합)
  GetReservationsFunction:
    Type: AWS::Lambda::Function
    DependsOn: XRaySDKLayer
    Properties:
      FunctionName: !Sub '${EnvironmentName}-GetReservations'
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      TracingConfig:
        Mode: Active
      Layers:
        - !GetAtt XRaySDKLayer.LayerVersionArn
      Environment:
        Variables:
          TABLE_NAME: !Ref ReservationsTable
      Code:
        ZipFile: |
          """
          QuickTable 예약 조회 Lambda 함수 (AWS X-Ray SDK 통합)

          이 함수는 예약 조회 요청을 처리하고, AWS X-Ray SDK를 사용하여
          커스텀 서브세그먼트, 어노테이션, 메타데이터를 기록합니다.

          환경 변수:
              TABLE_NAME (str): DynamoDB 테이블 이름
          """
          import json
          import boto3
          import os
          from decimal import Decimal
          from aws_xray_sdk.core import patch_all, xray_recorder

          # boto3 DynamoDB 호출 자동 추적
          patch_all()

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])

          class DecimalEncoder(json.JSONEncoder):
              """DynamoDB Decimal을 JSON 직렬화하기 위한 인코더"""
              def default(self, obj):
                  if isinstance(obj, Decimal):
                      return int(obj)
                  return super().default(obj)

          def lambda_handler(event, context):
              """
              예약 조회 핸들러

              Args:
                  event (dict): API Gateway 프록시 이벤트
                  context: Lambda 실행 컨텍스트

              Returns:
                  dict: HTTP 응답 (statusCode, headers, body)
              """
              try:
                  # 쿼리 파라미터에서 userId 추출 (기본값: anonymous)
                  params = event.get('queryStringParameters') or {}
                  user_id = params.get('userId', 'anonymous')

                  # 커스텀 서브세그먼트: DynamoDB 조회
                  subsegment = xray_recorder.begin_subsegment('get_reservations')
                  subsegment.put_annotation('operation', 'get')
                  subsegment.put_annotation('user_id', user_id)

                  response = table.query(
                      KeyConditionExpression='userId = :uid',
                      ExpressionAttributeValues={':uid': user_id}
                  )
                  items = response.get('Items', [])
                  subsegment.put_metadata('reservation_count', len(items))
                  subsegment.put_metadata('user_id', user_id)
                  xray_recorder.end_subsegment()

                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps(items, cls=DecimalEncoder)
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'error': str(e)})
                  }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Amazon API Gateway: QuickTableXRayAPI
  QuickTableXRayAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: QuickTableXRayAPI
      Description: QuickTable Reservation API with X-Ray Tracing
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  ReservationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref QuickTableXRayAPI
      ParentId: !GetAtt QuickTableXRayAPI.RootResourceId
      PathPart: reservations

  CreateReservationMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref QuickTableXRayAPI
      ResourceId: !Ref ReservationsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateReservationFunction.Arn}/invocations'

  GetReservationsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref QuickTableXRayAPI
      ResourceId: !Ref ReservationsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetReservationsFunction.Arn}/invocations'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CreateReservationMethod
      - GetReservationsMethod
    Properties:
      RestApiId: !Ref QuickTableXRayAPI

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      RestApiId: !Ref QuickTableXRayAPI
      DeploymentId: !Ref ApiDeployment
      TracingEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  CreateReservationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateReservationFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${QuickTableXRayAPI}/*/*/*'

  GetReservationsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetReservationsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${QuickTableXRayAPI}/*/*/*'

Outputs:
  ApiUrl:
    Description: API Gateway Invoke URL
    Value: !Sub 'https://${QuickTableXRayAPI}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}'

  CreateFunctionName:
    Description: CreateReservation Lambda Function Name
    Value: !Ref CreateReservationFunction

  GetFunctionName:
    Description: GetReservations Lambda Function Name
    Value: !Ref GetReservationsFunction

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref ReservationsTable
