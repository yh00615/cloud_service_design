version: 0.2

# AWS CodeBuild buildspec for S3 static website deployment
# Week 9-3: CodePipeline + CodeBuild + S3

phases:
  pre_build:
    commands:
      - echo "Pre-build phase started"
      - aws --version
      - echo "Listing files"
      - ls -la
  build:
    commands:
      - echo "Build phase started - no build steps required for static website"
  post_build:
    commands:
      - 'echo "Deploying to S3 bucket: $BUCKET_NAME"'
      - 'aws s3 sync . s3://$BUCKET_NAME --delete --exclude "buildspec.yml" --exclude ".git/*" --exclude "README.md"'
      - echo "Deployment completed successfully"
      - 'echo "Website URL: http://$BUCKET_NAME.s3-website.ap-northeast-2.amazonaws.com"'
