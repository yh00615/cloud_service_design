AWSTemplateFormatVersion: '2010-09-09'
Description: 'Week 12-3: QuickTable API Infrastructure for AWS WAF Lab (Pre-built Infrastructure)'

Parameters:
  EnvironmentName:
    Type: String
    Default: week12-3-quicktable-api
    Description: Environment name for resource naming
    AllowedPattern: ^[a-z0-9-]+$
    ConstraintDescription: Must contain only lowercase letters, numbers, and hyphens

  ProjectTag:
    Type: String
    Default: 'AWS-Lab'
    Description: Project tag value

  WeekTag:
    Type: String
    Default: '12-3'
    Description: Week tag value

  CreatedByTag:
    Type: String
    Default: 'CloudFormation'
    Description: CreatedBy tag value

Resources:
  # DynamoDB Table: QuickTableReservations
  ReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Week12-3-QuickTableReservations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: visitorId
          AttributeType: S
        - AttributeName: reservationId
          AttributeType: S
      KeySchema:
        - AttributeName: visitorId
          KeyType: HASH
        - AttributeName: reservationId
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # IAM Role: Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-Lambda-ExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt ReservationsTable.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Lambda Function: CreateReservation (Cognito 의존성 제거)
  CreateReservationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Week12-3-CreateReservation
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref ReservationsTable
      Code:
        ZipFile: |
          """
          AWS Lambda: QuickTable 예약 생성 (WAF 데모용)

          Cognito 인증 없이 동작하는 버전입니다.
          요청 IP를 visitorId로 사용하여 예약을 생성합니다.

          환경 변수:
              TABLE_NAME (str): DynamoDB 테이블 이름

          트리거:
              API Gateway POST /reservations
          """

          import json
          import boto3
          import os
          import uuid
          from datetime import datetime

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])

          def lambda_handler(event, context):
              try:
                  # 요청 IP를 visitorId로 사용 (Cognito 없이 사용자 식별)
                  visitor_id = event['requestContext']['identity']['sourceIp']

                  body = json.loads(event['body'])
                  reservation_id = str(uuid.uuid4())
                  created_at = datetime.utcnow().isoformat() + 'Z'

                  item = {
                      'visitorId': visitor_id,
                      'reservationId': reservation_id,
                      'restaurantName': body['restaurantName'],
                      'date': body['date'],
                      'time': body['time'],
                      'partySize': int(body['partySize']),
                      'phoneNumber': body.get('phoneNumber', ''),
                      'status': 'pending',
                      'createdAt': created_at
                  }

                  table.put_item(Item=item)

                  return {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps(item)
                  }

              except KeyError as e:
                  return {
                      'statusCode': 400,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({'error': f'Missing required field: {str(e)}'})
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({'error': str(e)})
                  }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Lambda Function: GetReservations (Cognito 의존성 제거)
  GetReservationsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Week12-3-GetReservations
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref ReservationsTable
      Code:
        ZipFile: |
          """
          AWS Lambda: QuickTable 예약 목록 조회 (WAF 데모용)

          Cognito 인증 없이 동작하는 버전입니다.
          요청 IP 기반으로 해당 방문자의 예약을 조회합니다.

          환경 변수:
              TABLE_NAME (str): DynamoDB 테이블 이름

          트리거:
              API Gateway GET /reservations
          """

          import json
          import boto3
          import os
          from decimal import Decimal

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])

          class DecimalEncoder(json.JSONEncoder):
              def default(self, obj):
                  if isinstance(obj, Decimal):
                      return int(obj)
                  return super(DecimalEncoder, self).default(obj)

          def lambda_handler(event, context):
              try:
                  # 요청 IP를 visitorId로 사용
                  visitor_id = event['requestContext']['identity']['sourceIp']

                  response = table.query(
                      KeyConditionExpression='visitorId = :vid',
                      ExpressionAttributeValues={
                          ':vid': visitor_id
                      }
                  )

                  items = response.get('Items', [])

                  return {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps(items, cls=DecimalEncoder)
                  }

              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({'error': str(e)})
                  }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # API Gateway: REST API
  QuickTableAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: Week12-3-QuickTableAPI
      Description: QuickTable Restaurant Reservation API for WAF Demo
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # API Gateway Resource: /reservations
  ReservationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref QuickTableAPI
      ParentId: !GetAtt QuickTableAPI.RootResourceId
      PathPart: reservations

  # API Gateway Method: POST /reservations
  CreateReservationMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref QuickTableAPI
      ResourceId: !Ref ReservationsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateReservationFunction.Arn}/invocations'

  # API Gateway Method: GET /reservations
  GetReservationsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref QuickTableAPI
      ResourceId: !Ref ReservationsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetReservationsFunction.Arn}/invocations'

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CreateReservationMethod
      - GetReservationsMethod
    Properties:
      RestApiId: !Ref QuickTableAPI
      StageName: prod

  # Lambda Permission: API Gateway to invoke CreateReservation
  CreateReservationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateReservationFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${QuickTableAPI}/*/*/*'

  # Lambda Permission: API Gateway to invoke GetReservations
  GetReservationsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetReservationsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${QuickTableAPI}/*/*/*'

Outputs:
  ApiGatewayInvokeUrl:
    Description: API Gateway Invoke URL
    Value: !Sub 'https://${QuickTableAPI}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: !Sub '${EnvironmentName}-ApiGatewayInvokeUrl'

  ApiGatewayId:
    Description: API Gateway REST API ID
    Value: !Ref QuickTableAPI
    Export:
      Name: !Sub '${EnvironmentName}-ApiGatewayId'

  ApiGatewayStageArn:
    Description: API Gateway Stage ARN (for WAF WebACL association)
    Value: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${QuickTableAPI}/stages/prod'
    Export:
      Name: !Sub '${EnvironmentName}-ApiGatewayStageArn'

  DynamoDBTableName:
    Description: DynamoDB Table Name
    Value: !Ref ReservationsTable
    Export:
      Name: !Sub '${EnvironmentName}-DynamoDBTableName'

  LambdaExecutionRoleArn:
    Description: Lambda Execution Role ARN
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-LambdaExecutionRoleArn'
