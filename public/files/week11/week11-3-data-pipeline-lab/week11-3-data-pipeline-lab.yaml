AWSTemplateFormatVersion: '2010-09-09'
Description: 'Week 11-3: AWS Glue Data Pipeline Construction Lab Environment'

Parameters:
  StudentId:
    Type: String
    Description: Student ID or unique identifier (lowercase, numbers, hyphens only, e.g., 20240001 or student01)
    AllowedPattern: ^[a-z0-9-]+$
    MinLength: 5
    MaxLength: 20
    ConstraintDescription: Only lowercase letters, numbers, and hyphens allowed (5-20 characters)

  EnvironmentName:
    Type: String
    Default: week11-3-pipeline
    Description: Environment name (used for resource naming)
    AllowedPattern: ^[a-z0-9-]+$
    ConstraintDescription: Only lowercase letters, numbers, and hyphens allowed

  ProjectTag:
    Type: String
    Default: 'AWS-Lab'
    Description: Project tag value

  WeekTag:
    Type: String
    Default: '11-3'
    Description: Week tag value

  CreatedByTag:
    Type: String
    Default: 'CloudFormation'
    Description: CreatedBy tag value

Resources:
  # S3 Buckets - 학번으로 고유성 보장
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'week11-data-${StudentId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Data'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  ScriptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'week11-scripts-${StudentId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Scripts'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  TempBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'week11-temp-${StudentId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTempFiles
            Status: Enabled
            ExpirationInDays: 1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Temp'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Glue Service Role (Crawler + ETL Job 공용)
  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'week11-3-pipeline-stack-GlueServiceRole-${StudentId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole'
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub '${DataBucket.Arn}/*'
                  - !Sub '${ScriptsBucket.Arn}/*'
                  - !Sub '${TempBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !GetAtt ScriptsBucket.Arn
                  - !GetAtt TempBucket.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-GlueServiceRole'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Lambda Function for Pipeline Trigger
  PipelineTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-PipelineTriggerRole-${StudentId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartCrawler
                  - glue:GetCrawler
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:crawler/week11-pipeline-crawler-${StudentId}'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PipelineTriggerRole'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  PipelineTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'week11-pipeline-trigger-${StudentId}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PipelineTriggerRole.Arn
      Timeout: 60
      Environment:
        Variables:
          CRAWLER_NAME: !Sub 'week11-pipeline-crawler-${StudentId}'
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          
          glue = boto3.client('glue')
          
          def handler(event, context):
              crawler_name = os.environ['CRAWLER_NAME']
              
              try:
                  # EventBridge 이벤트에서 S3 파일 정보 추출
                  bucket = event['detail']['bucket']['name']
                  key = event['detail']['object']['key']
                  
                  print(f'New file uploaded: s3://{bucket}/{key}')
                  
                  # raw/ 폴더의 파일만 처리
                  if key.startswith('raw/'):
                      print(f'Starting crawler: {crawler_name}')
                      glue.start_crawler(Name=crawler_name)
                  else:
                      print(f'Skipping non-raw file: {key}')
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'message': 'Pipeline triggered successfully',
                          'crawler': crawler_name
                      })
                  }
              except glue.exceptions.CrawlerRunningException:
                  print(f'Crawler {crawler_name} is already running. Skipping.')
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'message': 'Crawler already running',
                          'crawler': crawler_name
                      })
                  }
              except Exception as e:
                  print(f'Error: {str(e)}')
                  return {
                      'statusCode': 500,
                      'body': json.dumps({
                          'error': str(e)
                      })
                  }
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PipelineTrigger'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # EventBridge Rule for S3 Events
  S3EventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'week11-s3-event-rule-${StudentId}'
      Description: Trigger pipeline when new data arrives in S3
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref DataBucket
          object:
            key:
              - prefix: raw/
      Targets:
        - Arn: !GetAtt PipelineTriggerFunction.Arn
          Id: PipelineTriggerTarget

  # Lambda Permission for EventBridge
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PipelineTriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt S3EventRule.Arn

  # CloudWatch Logs Group
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PipelineTriggerFunction}'
      RetentionInDays: 7
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-LambdaLogGroup'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Sample Data Uploader
  SampleDataUploaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-SampleDataUploaderRole-${StudentId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub '${DataBucket.Arn}/*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-SampleDataUploaderRole'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  SampleDataUploaderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-SampleDataUploader-${StudentId}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SampleDataUploaderRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          
          s3 = boto3.client('s3')
          
          # 샘플 거래 데이터
          SAMPLE_TRANSACTIONS = """transaction_id,customer_id,product_id,amount,transaction_date,region
          1001,C001,P100,49.99,2024-01-15,Seoul
          1002,C002,P101,99.99,2024-01-15,Busan
          1003,C003,P102,29.99,2024-01-15,Seoul
          1004,C001,P103,149.99,2024-01-16,Seoul
          1005,C004,P100,49.99,2024-01-16,Daegu
          1006,C005,P104,199.99,2024-01-17,Seoul
          1007,C002,P102,29.99,2024-01-17,Busan
          1008,C006,P101,99.99,2024-01-18,Incheon
          1009,C003,P105,79.99,2024-01-18,Seoul
          1010,C007,P100,49.99,2024-01-19,Daejeon"""
          
          def handler(event, context):
              try:
                  if event['RequestType'] == 'Create':
                      data_bucket = event['ResourceProperties']['DataBucket']
                      
                      # 샘플 거래 데이터 업로드
                      s3.put_object(
                          Bucket=data_bucket,
                          Key='raw/transactions.csv',
                          Body=SAMPLE_TRANSACTIONS.strip().encode('utf-8'),
                          ContentType='text/csv'
                      )
                      
                      # processed/ 폴더 생성 (빈 폴더)
                      s3.put_object(
                          Bucket=data_bucket,
                          Key='processed/',
                          Body=b'',
                          ContentType='application/x-directory'
                      )
                      
                      print(f'Successfully uploaded sample data to {data_bucket}')
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'Message': 'Sample data uploaded successfully'
                  })
              except Exception as e:
                  print(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': str(e)
                  })
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-SampleDataUploader'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Custom Resource to Upload Sample Data
  UploadSampleData:
    Type: Custom::S3Upload
    Properties:
      ServiceToken: !GetAtt SampleDataUploaderFunction.Arn
      DataBucket: !Ref DataBucket

Outputs:
  DataBucketName:
    Description: Data Bucket Name (raw and processed data)
    Value: !Ref DataBucket
    Export:
      Name: !Sub '${AWS::StackName}-DataBucket'

  ScriptsBucketName:
    Description: Scripts Bucket Name (Glue ETL scripts)
    Value: !Ref ScriptsBucket
    Export:
      Name: !Sub '${AWS::StackName}-ScriptsBucket'

  TempBucketName:
    Description: Temp Bucket Name (temporary storage)
    Value: !Ref TempBucket
    Export:
      Name: !Sub '${AWS::StackName}-TempBucket'

  GlueServiceRoleName:
    Description: Glue Service Role Name (for Crawler and ETL Job)
    Value: !Ref GlueServiceRole
    Export:
      Name: !Sub '${AWS::StackName}-GlueServiceRole'

  PipelineTriggerFunctionName:
    Description: Pipeline Trigger Lambda Function Name
    Value: !Ref PipelineTriggerFunction
    Export:
      Name: !Sub '${AWS::StackName}-PipelineTriggerFunction'

  SampleDataLocation:
    Description: Sample data location
    Value: !Sub |
      샘플 데이터가 자동으로 업로드되었습니다:
      - 거래 데이터: s3://${DataBucket}/raw/transactions.csv
