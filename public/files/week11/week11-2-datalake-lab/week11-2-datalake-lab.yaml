AWSTemplateFormatVersion: '2010-09-09'
Description: 'Week 11-2: AWS Glue Crawler and Amazon Athena Query Lab Environment'

Parameters:
  StudentId:
    Type: String
    Description: Student ID or unique identifier (lowercase, numbers, hyphens only, e.g., 20240001 or student01)
    AllowedPattern: ^[a-z0-9-]+$
    MinLength: 5
    MaxLength: 20
    ConstraintDescription: Only lowercase letters, numbers, and hyphens allowed (5-20 characters)

  EnvironmentName:
    Type: String
    Default: 'quicktable'
    Description: Environment name (used as S3 bucket prefix)
    AllowedPattern: ^[a-z0-9-]+$
    ConstraintDescription: Only lowercase letters, numbers, and hyphens allowed

  ProjectTag:
    Type: String
    Default: 'AWS-Lab'
    Description: Project tag value

  WeekTag:
    Type: String
    Default: '11-2'
    Description: Week tag value

  CreatedByTag:
    Type: String
    Default: 'CloudFormation'
    Description: CreatedBy tag value

Resources:
  # S3 Buckets - unique per student
  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-raw-${StudentId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-RawData'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  ProcessedDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-processed-${StudentId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ProcessedData'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  QueryResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-query-${StudentId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldQueryResults
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-QueryResults'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Glue Crawler IAM Role
  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'week11-2-quicktable-datalake-stack-GlueCrawlerRole-${StudentId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole'
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub '${RawDataBucket.Arn}/*'
                  - !Sub '${ProcessedDataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt RawDataBucket.Arn
                  - !GetAtt ProcessedDataBucket.Arn
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-GlueCrawlerRole'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Lambda Function for Sample Data Upload (Custom Resource)
  SampleDataUploaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'week11-2-SampleDataUploaderRole-${StudentId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource:
                  - !Sub '${RawDataBucket.Arn}/*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-SampleDataUploaderRole'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  SampleDataUploaderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'week11-2-SampleDataUploader-${StudentId}'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt SampleDataUploaderRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse

          s3 = boto3.client('s3')

          # QuickTable reservation sample CSV data
          RESERVATIONS_CSV = """reservationId,userId,restaurantId,restaurantName,date,time,partySize,status,totalAmount,createdAt
          RES001,user123,REST001,Gangnam Restaurant,2024-01-15,18:30,4,confirmed,120000,2024-01-10T10:30:00.123456
          RES002,user456,REST002,Seoul Korean,2024-01-16,19:00,2,cancelled,60000,2024-01-12T14:20:00.234567
          RES003,user789,REST001,Gangnam Restaurant,2024-01-17,12:00,6,confirmed,180000,2024-01-15T09:15:00.345678
          RES004,user123,REST003,Busan Seafood,2024-01-20,19:30,3,confirmed,90000,2024-01-18T11:45:00.456789
          RES005,user456,REST002,Seoul Korean,2024-01-22,20:00,5,confirmed,150000,2024-01-20T16:30:00.567890"""

          # QuickTable restaurant info JSON Lines data
          RESTAURANTS_JSON = """{"restaurantId": "REST001", "name": "Gangnam Restaurant", "cuisine": "Korean", "location": "Gangnam", "rating": 4.5}
          {"restaurantId": "REST002", "name": "Seoul Korean", "cuisine": "Korean", "location": "Seoul", "rating": 4.2}
          {"restaurantId": "REST003", "name": "Busan Seafood", "cuisine": "Seafood", "location": "Busan", "rating": 4.7}"""

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Create':
                      bucket = event['ResourceProperties']['BucketName']
                      
                      # Upload reservation CSV file
                      s3.put_object(
                          Bucket=bucket,
                          Key='reservation-data/reservations.csv',
                          Body=RESERVATIONS_CSV.strip().encode('utf-8'),
                          ContentType='text/csv'
                      )
                      
                      # Upload restaurant JSON Lines file
                      s3.put_object(
                          Bucket=bucket,
                          Key='restaurant-data/restaurants.json',
                          Body=RESTAURANTS_JSON.strip().encode('utf-8'),
                          ContentType='application/json'
                      )
                      
                      print(f'Successfully uploaded sample data to {bucket}')
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'Message': 'Sample data uploaded successfully'
                  })
              except Exception as e:
                  print(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': str(e)
                  })
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-SampleDataUploader'
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Week
          Value: !Ref WeekTag
        - Key: CreatedBy
          Value: !Ref CreatedByTag

  # Custom Resource to Upload Sample Data
  UploadSampleData:
    Type: Custom::S3Upload
    Properties:
      ServiceToken: !GetAtt SampleDataUploaderFunction.Arn
      BucketName: !Ref RawDataBucket

Outputs:
  RawDataBucketName:
    Description: Raw Data S3 Bucket Name
    Value: !Ref RawDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-RawDataBucket'

  ProcessedDataBucketName:
    Description: Processed Data S3 Bucket Name
    Value: !Ref ProcessedDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-ProcessedDataBucket'

  QueryResultsBucketName:
    Description: Athena Query Results S3 Bucket Name
    Value: !Ref QueryResultsBucket
    Export:
      Name: !Sub '${AWS::StackName}-QueryResultsBucket'

  GlueCrawlerRoleArn:
    Description: Glue Crawler IAM Role ARN
    Value: !GetAtt GlueCrawlerRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GlueCrawlerRoleArn'

  SampleDataLocation:
    Description: Sample data location
    Value: !Sub |
      Sample data uploaded automatically:
      - Reservations: s3://${RawDataBucket}/reservation-data/reservations.csv
      - Restaurants: s3://${RawDataBucket}/restaurant-data/restaurants.json
